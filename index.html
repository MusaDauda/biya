<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Biya: hold dollars, spend naira</title>
    <meta name="description" content="A dollar account for Nigeria. Hold dollars, pay any vendor in naira, with the rate locked the moment you scan." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F2F3F5" />
    <!-- SVG first for browsers that take it, PNG sizes behind it for those that
         do not. The 16px file carries the closed monogram: below 24px the seal's
         counters and the departure dot turn to mud, which is the brand's own floor. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Biya" />
    <!-- "default" keeps dark status bar text, which is what the cream app surface needs. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }

      /* Mobile-first PWA. In standalone mode there is no browser chrome, so the
         app owns the full screen including the area under the notch and the
         home indicator. These are read by layout code rather than applied
         globally, so a full-bleed screen can still bleed. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      /* No rubber-band scroll or double-tap zoom: both read as "web page"
         rather than "app" the moment someone handles it on stage. */
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .whisper-shadow { box-shadow: 0 40px 40px -15px rgba(0,0,0,0.05); }
      .text-balance { text-wrap: balance; }
      .bento-card { transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), background-color 0.3s ease; }
      .bento-card:hover { transform: translateY(-4px); }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
